[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabah-moe-accelerator"
version = "0.9.0rc2"
description = "Exact-routing MoE inference accelerator for GGUF models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24"]

[project.scripts]
sabah = "sabah.tools.cli:main"

[tool.setuptools.packages.find]
include = ["sabah*"]

[tool.setuptools.package-data]
sabah = ["hardware/*.cu", "runtime/cuda/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
